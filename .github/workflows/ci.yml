name: Verify Trader Analytics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Clean Cloudflare production build
        run: npm run cloudflare:build

      - name: Verify static deployment shape
        run: |
          test -f out/index.html
          test ! -f .wrangler/deploy/config.json

      - name: Wrangler deployment dry run
        run: npx wrangler deploy --dry-run
