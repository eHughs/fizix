name: Verify Trader Analytics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify Supabase fallback is bundled
        run: grep -R -q "bekaoohyvuqrqezhcodj.supabase.co" out/_next/static

      - name: Cloudflare deployment dry run
        run: npx --yes wrangler@4.127.1 deploy --dry-run
