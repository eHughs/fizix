name: Verify Trader Analytics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Next.js compatibility build
        run: npm run build:next

      - name: Cloudflare vinext production build
        run: npm run build

      - name: Cloudflare deploy-path dry run
        run: npm run deploy -- --dry-run
