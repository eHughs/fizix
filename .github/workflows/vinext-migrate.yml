name: Migrate to Cloudflare vinext

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install current dependencies
        run: npm ci --no-audit --no-fund

      - name: Check vinext compatibility
        run: npx --yes vinext@latest check

      - name: Initialize vinext for Cloudflare Workers
        run: npx --yes vinext@latest init --platform=cloudflare

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Migrate Cloudflare deployment to vinext"
          git push
